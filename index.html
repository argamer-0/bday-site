<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 400px;
            position: relative;
        }
        h1 {
            color: #ff4757;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }
        .btn {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        #yes-btn {
            background-color: #2ed573;
            color: white;
        }
        #no-btn {
            background-color: #ff4757;
            color: white;
            position: absolute;
        }
        .celebration h2 {
            color: #2ed573;
            font-size: 26px;
            margin-bottom: 15px;
        }
        .celebration p {
            color: #333;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h1 id="question">Kya duniya ki sabse cool aur mast bua ki beti aap hi ho? 😎</h1>
        <div class="btn-group" id="btn-group">
            <button class="btn" id="yes-btn" onclick="celebrate()">YES! 💖</button>
            <button class="btn" id="no-btn" onmouseover="moveNo()" onclick="moveNo()">NO 🙄</button>
        </div>
    </div>

    <script>
        function moveNo() {
            const noBtn = document.getElementById('no-btn');
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function celebrate() {
            const card = document.getElementById('main-card');
            card.innerHTML = `
                <div class="celebration">
                    <h2>🎉 HAPPY BIRTHDAY! 🎂</h2>
                    <p>Bhagwan tumhe duniya ki saari khushiyan de, tumhari har wish poori ho, aur tum hamesha aise hi hasti raho! 🚀✨</p>
                    <p style="margin-top: 20px; font-weight: bold; color: #ff4757;">- From Your Cool Sibling 👊</p>
                </div>
            `;
        }
    </script>
</body>
</html>
